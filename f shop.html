<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>F Shop – ช้อปครบ จบในที่เดียว</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap"
      rel="stylesheet"

      :root {
        --o: #ee4d2d;
        --b: #1565c0;
        --n: #131a22;
        --bg: #f3f4f6;
        --c: #fff;
        --t: #1f2937;
        --m: #6b7280;
        --l: #e5e7eb;
        box-sizing: border-box;
        padding: env(safe-area-inset-top, 0px) 0
          env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e1116;
          --c: #1a1f27;
          --t: #e8eaed;
          --m: #9aa3af;
          --l: #2d343f;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e1116;
        --c: #1a1f27;
        --t: #e8eaed;
        --m: #9aa3af;
        --l: #2d343f;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.5 "Noto Sans Thai",
          system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--t);
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 10;
        background: var(--o);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      .w {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 12px;
      }
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 9;
        background: linear-gradient(90deg, #ee4d2d, #ff7a3d);
        color: #fff;
      }
      .hd {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 0;
        flex-wrap: wrap;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 22px;
        cursor: pointer;
      }
      .lg {
        position: relative;
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 11px;
        background: #fff;
        color: var(--o);
        font-weight: 800;
        font-size: 25px;
        line-height: 1;
        transform: rotate(-6deg);
        box-shadow: 0 2px 0 #ffd54f;
      }
      .lg::after {
        content: "";
        position: absolute;
        right: 5px;
        bottom: 5px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--b);
      }
      .sr {
        flex: 1;
        min-width: 200px;
        display: flex;
      }
      .sr input {
        border: 0;
        border-radius: 6px 0 0 6px;
        background: #fff;
        color: #222;
      }
      .sr button {
        border: 0;
        background: var(--n);
        color: #fff;
        padding: 0 16px;
        border-radius: 0 6px 6px 0;
        cursor: pointer;
      }
      .ib {
        background: none;
        border: 0;
        color: #fff;
        cursor: pointer;
        position: relative;
        padding: 6px;
      }
      .bd {
        position: absolute;
        top: -2px;
        right: -4px;
        background: var(--b);
        border-radius: 9px;
        font-size: 11px;
        padding: 0 5px;
      }
      nav {
        background: var(--n);
        color: #fff;
        font-size: 13px;
      }
      nav .w {
        display: flex;
        gap: 16px;
        overflow-x: auto;
        padding-top: 7px;
        padding-bottom: 7px;
        white-space: nowrap;
      }
      nav a {
        cursor: pointer;
        opacity: 0.9;
      }
      .g {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 10px;
      }
      .cd {
        background: var(--c);
        border-radius: 8px;
        overflow: hidden;
        position: relative;
        cursor: pointer;
        border: 1px solid var(--l);
      }
      .im {
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        font-size: 64px;
        background: var(--h);
      }
      .cd .p {
        padding: 8px;
      }
      .nm {
        font-size: 13px;
        height: 40px;
        overflow: hidden;
      }
      .pr {
        color: var(--o);
        font-weight: 700;
        font-size: 17px;
      }
      .old {
        color: var(--m);
        text-decoration: line-through;
        font-size: 12px;
        margin-left: 4px;
      }
      .sm {
        font-size: 12px;
        color: var(--m);
      }
      .tag {
        position: absolute;
        top: 6px;
        left: 6px;
        background: #ffd54f;
        color: #b3261e;
        font-size: 12px;
        font-weight: 700;
        padding: 1px 6px;
        border-radius: 4px;
      }
      .hb {
        position: absolute;
        top: 4px;
        right: 6px;
        background: #fff9;
        border: 0;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        font-size: 16px;
        cursor: pointer;
      }
      .btn {
        border: 0;
        border-radius: 6px;
        padding: 9px 14px;
        cursor: pointer;
        background: var(--o);
        color: #fff;
        font-weight: 600;
      }
      .btn.b {
        background: var(--b);
      }
      .btn.g2 {
        background: var(--l);
        color: var(--t);
      }
      .btn.s {
        padding: 4px 9px;
        font-size: 13px;
      }
      .box {
        background: var(--c);
        border: 1px solid var(--l);
        border-radius: 8px;
        padding: 14px;
        margin: 12px 0;
      }
      h2 {
        font-size: 18px;
        margin: 16px 0 8px;
      }
      .hero {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 10px;
        margin-top: 12px;
      }
      .bn {
        border-radius: 10px;
        padding: 22px;
        color: #fff;
        min-height: 140px;
      }
      .cats {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 8px;
      }
      .ct {
        background: var(--c);
        border-top: 3px solid var(--b);
        border-radius: 8px;
        text-align: center;
        padding: 10px 4px;
        font-size: 13px;
        cursor: pointer;
      }
      .ct span {
        display: block;
        font-size: 30px;
      }
      .tk {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 6px;
      }
      .v {
        flex: 0 0 136px;
        aspect-ratio: 9/14;
        border-radius: 10px;
        color: #fff;
        position: relative;
        cursor: pointer;
        display: grid;
        place-items: center;
        font-size: 56px;
      }
      .v small {
        position: absolute;
        bottom: 6px;
        left: 8px;
        right: 8px;
        font-size: 11px;
        line-height: 1.3;
      }
      .v i {
        position: absolute;
        top: 6px;
        left: 8px;
        font-size: 11px;
        font-style: normal;
        background: #fe2c55;
        padding: 0 6px;
        border-radius: 4px;
      }
      .cdn {
        background: var(--n);
        color: #fff;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 14px;
        margin-left: 6px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      td,
      th {
        padding: 6px;
        border-bottom: 1px solid var(--l);
        text-align: left;
      }
      .tb {
        overflow-x: auto;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .fl {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      input,
      select,
      textarea {
        background: var(--c);
        border: 1px solid var(--l);
        border-radius: 6px;
        padding: 8px;
        width: 100%;
      }
      .ov {
        position: fixed;
        inset: 0;
        background: #0008;
        display: grid;
        place-items: center;
        z-index: 20;
        padding: 12px;
      }
      .ov .box {
        width: 100%;
        max-width: 440px;
        max-height: 90vh;
        overflow: auto;
      }
      .ov label {
        display: block;
        margin-top: 8px;
      }
      .pd {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      #toast {
        position: fixed;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        left: 50%;
        transform: translateX(-50%);
        background: var(--n);
        color: #fff;
        padding: 8px 16px;
        border-radius: 20px;
        z-index: 30;
        display: none;
      }
      .im img,
      .sl img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .sl {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        border-radius: 14px;
        background: #fff;
        color: #222;
        font-size: 36px;
        overflow: hidden;
        flex: none;
        border: 1px solid var(--l);
      }
      .sl.m {
        width: 44px;
        height: 44px;
        font-size: 26px;
      }
      .ct .sl {
        margin: 0 auto;
      }
      @media (max-width: 700px) {
        .hero,
        .pd {
          grid-template-columns: 1fr;
        }
        .im {
          font-size: 52px;
        }
      }
    </style>
  </head>
  <body>

<h2>🔥 วิดีโอสินค้ายอดฮิต</h2><div class="tk">${hot

<h2>แนะนำสำหรับคุณ</h2>${grid(PL().slice(0, 12))}</div>`;

      V.cart = () => {

          : V.login();

      // ===== 6.5) Marketplace หลายผู้ขาย: ร้านค้า / ผู้ขาย / บทบาท =====
      const SHp = (id) => S.SH.find((s) => s.id == id),

        const s = Math.floor((m - n) / 1000);
        e.textContent = [(s / 3600) | 0, ((s / 60) % 60) | 0, s % 60]
          .map((x) => String(x).padStart(2, "0"))
          .join(":");
      }, 1000);
      R();
    </script>
  </body>
